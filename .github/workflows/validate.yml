name: Validate DNS benchmark

on:
  push:
    branches: [main, feature/doh-benchmark]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shell-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install BusyBox ash
        run: |
          sudo apt-get update
          sudo apt-get install -y busybox

      - name: Validate shell syntax
        run: |
          busybox ash -n dns-bench.sh
          busybox ash -n doh-bench.sh
          busybox ash -n 40-dnstest-dashboard.sh
          busybox ash -n install.sh
          busybox ash -n uninstall.sh
          busybox ash tests/test-doh.sh

      - name: Validate server lists and installer guards
        shell: bash
        run: |
          dns_count="$(sed -n "/^DNS_SERVERS='/,/^'$/p" dns-bench.sh | grep -c '|')"
          dot_count="$(sed -n "/^DOT_SERVERS='/,/^'$/p" dns-bench.sh | grep -c '|')"
          test "$dns_count" -eq 25
          test "$dot_count" -eq 13
          doh_count="$(sed -n "/^DOH_SERVERS='/,/^'$/p" doh-bench.sh | grep -c '|')"
          test "$doh_count" -eq 26
          host_count="$(sed -n "s/^DOMAINS='//p" doh-bench.sh | awk '{print NF}')"
          test "$host_count" -eq 12
          grep -Fq -- '--next' doh-bench.sh
          grep -Fq -- '--resolve' doh-bench.sh
          grep -Fq 'verify_dns_response' doh-bench.sh
          grep -Fq -- '--data-binary' doh-bench.sh
          grep -Fq 'HTTP method' doh-bench.sh
          grep -Fq 'DNSTEST_CURL' doh-bench.sh
          grep -Fq 'doh-bench.sh' install.sh
          grep -Fq 'doh-bench.sh' uninstall.sh
          grep -Fq -- '--doh' dns-bench.sh
          grep -Fq 'case "$-" in *i*)' 40-dnstest-dashboard.sh
          grep -Fq '[ -n "${SSH_CONNECTION:-}" ]' 40-dnstest-dashboard.sh
          grep -q '\$1 <= 4' 40-dnstest-dashboard.sh
          grep -q 'for cmd in .*nl' dns-bench.sh
          grep -q "nl -w2 -s'|' \"\$TOP\"" dns-bench.sh
          grep -q 'install_nl()' install.sh
          grep -q 'install_timeout()' install.sh
          grep -q 'install_curl()' install.sh
          grep -q 'apk add curl' install.sh
          grep -q 'opkg install curl' install.sh
          grep -q 'apk add coreutils-timeout' install.sh
          grep -q 'opkg install coreutils-timeout' install.sh
          grep -q 'timeout 1 sh -c' install.sh
          grep -q 'apk add coreutils-nl' install.sh
          grep -q 'opkg install coreutils-nl' install.sh
          ! grep -q 'apk update' install.sh
          grep -q 'mkdir "\$TMP" || fail' dns-bench.sh
          grep -q 'rmdir "\$TMP"' dns-bench.sh
          grep -Fq 'Type YES to uninstall:' uninstall.sh
          grep -Fq 'latest-top4.txt, latest-doh.txt' uninstall.sh
          grep -Fq '/root/backup/dns/' uninstall.sh
          echo "Validated: UDP/TCP=$dns_count, DoT=$dot_count, DoH=$doh_count, hosts=$host_count"
